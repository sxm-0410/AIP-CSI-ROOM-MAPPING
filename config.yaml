# Wi-Fi CSI Room Mapping — runtime config.
# Everything here overrides the defaults in csi_mapping/config.py.
# Delete this file and the project still runs on baked-in defaults.

# --- capture backend -------------------------------------------------
# synthetic : no hardware, generated CSI (default so the demo runs anywhere)
# router    : current hardware — reads CSV file or udp://host:port
# esp32     : future hardware — reads USB serial (needs pyserial)
backend: synthetic
n_subcarriers: 64
sample_rate_hz: 100.0

# router backend source: a CSV log, or a live "udp://0.0.0.0:5500" stream
router_source: data/raw/router_csi.csv

# esp32 backend (used later)
esp32_port: /dev/ttyUSB0
esp32_baud: 921600

# --- cleaning (step 1: clean the signal) -----------------------------
hampel_window: 5
hampel_sigma: 3.0
butter_cutoff_hz: 10.0
butter_order: 4

# --- features / windowing (step 2: collect & extract) ----------------
window: 128
hop: 64

# --- room layout / occupant zones ------------------------------------
grid_rows: 2
grid_cols: 2
zones:
  - {name: empty,  row: 0, col: 0}
  - {name: desk,   row: 0, col: 1}
  - {name: door,   row: 1, col: 0}
  - {name: window, row: 1, col: 1}

# --- paths -----------------------------------------------------------
data_dir: data/sessions
model_path: models/zone_clf.pkl
