# Wi-Fi CSI Spatial Mapping — runtime config.
# Overrides the defaults in wifi_csi_spatial/config.py. Delete this file and the
# project still runs on baked-in defaults.

# --- capture backend -------------------------------------------------
# synthetic : no hardware, room-simulator CSI (default so the demo runs anywhere)
# router    : current hardware — CSV file or udp://host:port, one line per link
# esp32     : future hardware — USB serial per node (needs pyserial)
backend: synthetic
n_subcarriers: 256          # 80 MHz -> finer delay resolution for Phase 3
sample_rate_hz: 50.0
router_source: data/raw/router_csi.csv
esp32_port: /dev/ttyUSB0    # comma-separate one port per RX node
esp32_baud: 921600

# --- room geometry (metres) -----------------------------------------
room_w: 5.0
room_h: 4.0
tx: [0.05, 0.05]
rx:
  - [4.95, 0.05]
  - [4.95, 2.5]
  - [4.95, 3.95]
  - [0.05, 3.95]
wall_reflectivity: 0.45
obstacle_reflectivity: 1.6   # obstacle scatter strength (position fingerprint)
shadow_depth: 0.7            # max line-of-sight attenuation on a link
shadow_sigma: 1.0            # shadow corridor width (m)

# --- localization grid (Phase 1/2) ----------------------------------
grid_rows: 4
grid_cols: 4

# --- boundary reconstruction (Phase 3) ------------------------------
recon_res: 0.125
recon_margin: 0.5

# --- cleaning -------------------------------------------------------
hampel_window: 5
hampel_sigma: 3.0
butter_cutoff_hz: 10.0
butter_order: 4

# --- features / model -----------------------------------------------
pca_components: 64
cnn_epochs: 25

# --- paths ----------------------------------------------------------
data_dir: data/datasets
model_dir: models
